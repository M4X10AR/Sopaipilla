<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Paper Mario</title>
    <!-- Bootstrap (antes de style.css para que tus estilos tengan prioridad) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <header class="encabezado">
    <h1>Inventario de objetos</h1>
    <p>Paper Mario: La puerta milenaria · datos desde una base de datos MySQL.</p>
    </header>

    <main class="contenedor">
    <section class="filtros" aria-label="Filtros de objetos">
        <label for="buscarNombre">Buscar por nombre
        <input type="search" id="buscarNombre" placeholder="Ej.: champiñón">
        </label>
        <label for="filtroCategoria">Filtrar por habilidad
        <select id="filtroCategoria">
            <option value="">Todas las habilidades</option>
        </select>
        </label>
        <button type="button" id="limpiarFiltros">Limpiar filtros</button>
    </section>

    <p id="mensaje" role="status">Cargando objetos...</p>
    <div class="tabla-contenedor">
        <table>
        <thead>
            <tr>
            <th>Imagen</th>
            <th>Objeto</th>
            <th>Descripción</th>
            <th>Habilidad</th>
            <th>Tipo</th>
            </tr>
        </thead>
        <tbody id="tablaObjetos"></tbody>
        </table>
    </div>
    </main>

    <footer><p>Proyecto de práctica: fetch(), DOM, filtros y MySQL.</p></footer>
</body>
</html>
